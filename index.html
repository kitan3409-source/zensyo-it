<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全商 情報処理1級 4択クイズ（共通+ビジネス情報）</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card2: #273549;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --correct: #22c55e;
    --wrong: #ef4444;
    --border: #334155;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  .container { width: 100%; max-width: 720px; }
  header { text-align: center; margin-bottom: 14px; }
  header h1 { font-size: 1.35rem; margin-bottom: 4px; }
  header .sub { color: var(--muted); font-size: 0.8rem; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    align-items: center;
    margin-bottom: 12px;
  }
  select, .btn {
    background: var(--card2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  select:hover, .btn:hover { border-color: var(--accent); }
  .stats {
    display: flex;
    justify-content: center;
    gap: 18px;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .stats b { color: var(--text); }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 14px;
  }
  .q-badge {
    display: inline-block;
    font-size: 0.75rem;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(56, 189, 248, 0.15);
    color: var(--accent);
    margin-bottom: 12px;
  }
  .q-meta { color: var(--muted); font-size: 0.75rem; margin-bottom: 10px; }
  .prompt { font-size: 1.15rem; line-height: 1.7; margin-bottom: 20px; word-break: break-word; }
  .prompt.term { font-weight: 700; font-size: 1.4rem; color: var(--accent); }
  .choices { display: grid; gap: 10px; }
  .choice {
    text-align: left;
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 14px;
    color: var(--text);
    font-size: 0.95rem;
    line-height: 1.5;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .choice .num {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border-radius: 6px;
    background: var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
  }
  .choice:hover:not(:disabled) { border-color: var(--accent); }
  .choice:disabled { cursor: default; opacity: 0.85; }
  .choice.correct { border-color: var(--correct); background: rgba(34, 197, 94, 0.15); }
  .choice.correct .num { background: var(--correct); color: #052e16; }
  .choice.wrong { border-color: var(--wrong); background: rgba(239, 68, 68, 0.15); }
  .choice.wrong .num { background: var(--wrong); color: #450a0a; }
  .feedback {
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 0.9rem;
    line-height: 1.6;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.ok { background: rgba(34, 197, 94, 0.12); border: 1px solid var(--correct); }
  .feedback.ng { background: rgba(239, 68, 68, 0.12); border: 1px solid var(--wrong); }
  .feedback .label { font-weight: 700; margin-right: 8px; }
  .next-row { margin-top: 14px; display: none; justify-content: flex-end; }
  .next-row.show { display: flex; }
  .btn.primary { background: var(--accent); color: #082f49; font-weight: 700; border: none; padding: 10px 22px; }
  .btn.primary:hover { background: #7dd3fc; }
  .hint { text-align: center; color: var(--muted); font-size: 0.75rem; margin-top: 10px; }
  .weak-list { margin-top: 16px; font-size: 0.8rem; color: var(--muted); }
  .weak-list summary { cursor: pointer; }
  .weak-list ul { margin: 8px 0 0 18px; }
  .weak-list li { margin-bottom: 4px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>全商 情報処理1級 4択クイズ</h1>
    <div class="sub">共通範囲 + ビジネス情報部門 全<span id="totalTerms"></span>語 ｜ 令和8年度 出題範囲準拠</div>
  </header>

  <div class="controls">
    <select id="scopeSel" title="出題範囲"></select>
    <select id="modeSel" title="出題方式">
      <option value="all">ランダム出題</option>
      <option value="weak">苦手を優先して出題</option>
      <option value="wrongonly">間違えた語だけ出題</option>
    </select>
    <button class="btn" id="resetStatsBtn" title="学習記録を削除">記録リセット</button>
  </div>

  <div class="stats">
    <span>出題 <b id="statTotal">0</b></span>
    <span>正解 <b id="statCorrect">0</b></span>
    <span>正答率 <b id="statRate">-</b></span>
    <span>連続正解 <b id="statStreak">0</b></span>
  </div>

  <div class="card">
    <span class="q-badge" id="qBadge"></span>
    <div class="q-meta" id="qMeta"></div>
    <div class="prompt" id="qPrompt"></div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback"></div>
    <div class="next-row" id="nextRow">
      <button class="btn primary" id="nextBtn">次の問題 →</button>
    </div>
  </div>

  <div class="hint">キーボード: 1〜4 で回答 / Enter で次へ</div>

  <details class="weak-list" id="weakBox" style="display:none">
    <summary>間違えた用語一覧（<span id="weakCount">0</span>語）</summary>
    <ul id="weakList"></ul>
  </details>
</div>

<script>
const TERMS = [{"term": "ウォータフォールモデル", "meaning": "要件定義から運用・保守までの各工程を順番に進め、前の工程に戻らない一方通行の開発手法", "department": "共通", "category": "ハードウェア・ソフトウェアに関する知識", "subcategory": "システムの開発と運用"}, {"term": "プロトタイピングモデル", "meaning": "試作品（プロトタイプ）を早期に作成し、利用者の評価と改良を繰り返して仕様を確定する開発手法", "department": "共通", "category": "ハードウェア・ソフトウェアに関する知識", "subcategory": "システムの開発と運用"}, {"term": "スパイラルモデル", "meaning": "設計・プロトタイプ作成・評価のサイクルを繰り返し、段階的にシステムを完成させる開発手法", "department": "共通", "category": "ハードウェア・ソフトウェアに関する知識", "subcategory": "システムの開発と運用"}, {"term": "要件定義", "meaning": "利用者の要求を整理し、システムに求める機能や性能を明確にする開発工程", "department": "共通", "category": "ハードウェア・ソフトウェアに関する知識", "subcategory": "開発工程"}, {"term": "外部設計", "meaning": "画面や帳票など、利用者から見えるシステムの外部仕様を設計する工程", "department": "共通", "category": "ハードウェア・ソフトウェアに関する知識", "subcategory": "開発工程"}, {"term": "内部設計", "meaning": "外部設計を基に、システム内部の処理方式やデータ構造を設計する工程", "department": "共通", "category": "ハードウェア・ソフトウェアに関する知識", "subcategory": "開発工程"}, {"term": "プログラム設計", "meaning": "内部設計を基に、プログラム単位の処理手順やロジックを設計する工程", "department": "共通", "category": "ハードウェア・ソフトウェアに関する知識", "subcategory": "開発工程"}, {"term": "プログラミング", "meaning": "設計書に基づき、プログラム言語でコードを記述する工程", "department": "共通", "category": "ハードウェア・ソフトウェアに関する知識", "subcategory": "開発工程"}, {"term": "単体テスト", "meaning": "プログラム（モジュール）ごとに単独で正しく動作するか検証するテスト", "department": "共通", "category": "ハードウェア・ソフトウェアに関する知識", "subcategory": "テスト"}, {"term": "結合テスト", "meaning": "複数のモジュールを組み合わせ、インタフェースや連携が正しく動くか検証するテスト", "department": "共通", "category": "ハードウェア・ソフトウェアに関する知識", "subcategory": "テスト"}, {"term": "システムテスト", "meaning": "システム全体を本番に近い環境で動かし、要件を満たすか総合的に検証するテスト", "department": "共通", "category": "ハードウェア・ソフトウェアに関する知識", "subcategory": "テスト"}, {"term": "運用・保守", "meaning": "完成したシステムを稼働させ、障害対応や修正・改善を継続的に行う工程", "department": "共通", "category": "ハードウェア・ソフトウェアに関する知識", "subcategory": "開発工程"}, {"term": "ブラックボックステスト", "meaning": "内部構造を見ず、入力と出力の関係だけで仕様通りかを検証するテスト手法", "department": "共通", "category": "ハードウェア・ソフトウェアに関する知識", "subcategory": "テスト"}, {"term": "ホワイトボックステスト", "meaning": "プログラムの内部構造や論理を踏まえて、網羅的に検証するテスト手法", "department": "共通", "category": "ハードウェア・ソフトウェアに関する知識", "subcategory": "テスト"}, {"term": "開発期間に関する計算（人日・人月）", "meaning": "1人が1日（1か月）でこなす作業量を単位として、開発工数や期間を見積もる計算", "department": "共通", "category": "ハードウェア・ソフトウェアに関する知識", "subcategory": "システムの開発と運用"}, {"term": "RASIS", "meaning": "信頼性・可用性・保守性・完全性・安全性の5指標でシステムを評価する基準", "department": "共通", "category": "ハードウェア・ソフトウェアに関する知識", "subcategory": "性能・障害管理"}, {"term": "信頼性（Reliability）", "meaning": "RASISの1つ。システムが故障せず安定して動作する度合い", "department": "共通", "category": "ハードウェア・ソフトウェアに関する知識", "subcategory": "性能・障害管理"}, {"term": "可用性（Availability）", "meaning": "RASISの1つ。必要なときにシステムを利用できる度合い", "department": "共通", "category": "ハードウェア・ソフトウェアに関する知識", "subcategory": "性能・障害管理"}, {"term": "保守性（Serviceability）", "meaning": "RASISの1つ。障害時に容易に修理・回復できる度合い", "department": "共通", "category": "ハードウェア・ソフトウェアに関する知識", "subcategory": "性能・障害管理"}, {"term": "完全性（Integrity）", "meaning": "RASISの1つ。データが正確で矛盾なく保たれている度合い", "department": "共通", "category": "ハードウェア・ソフトウェアに関する知識", "subcategory": "性能・障害管理"}, {"term": "安全性（Security）", "meaning": "RASISの1つ。不正アクセスや破壊からシステムを守れる度合い", "department": "共通", "category": "ハードウェア・ソフトウェアに関する知識", "subcategory": "性能・障害管理"}, {"term": "稼働率", "meaning": "システムが正常に稼働している時間の割合。MTBF÷(MTBF+MTTR)で求める", "department": "共通", "category": "ハードウェア・ソフトウェアに関する知識", "subcategory": "性能・障害管理"}, {"term": "平均故障間隔（MTBF）", "meaning": "故障から次の故障までの平均時間。長いほど信頼性が高い", "department": "共通", "category": "ハードウェア・ソフトウェアに関する知識", "subcategory": "性能・障害管理"}, {"term": "平均修復時間（MTTR）", "meaning": "故障から復旧するまでの平均時間。短いほど保守性が高い", "department": "共通", "category": "ハードウェア・ソフトウェアに関する知識", "subcategory": "性能・障害管理"}, {"term": "スループット", "meaning": "単位時間あたりにシステムが処理できる仕事の量", "department": "共通", "category": "ハードウェア・ソフトウェアに関する知識", "subcategory": "性能・障害管理"}, {"term": "レスポンスタイム", "meaning": "利用者が要求を出してから応答が返るまでの時間", "department": "共通", "category": "ハードウェア・ソフトウェアに関する知識", "subcategory": "性能・障害管理"}, {"term": "ターンアラウンドタイム", "meaning": "ジョブを投入してから処理結果が出力されるまでの全時間 nt": "ビジネス情報", "category": "データベースソフトウェアに関する知識", "subcategory": "データベースの設計"}, {"term": "整合性制約（参照整合性）", "meaning": "外部キーが参照先の主キーと矛盾しないよう保つ制約", "department": "ビジネス情報", "category": "データベースソフトウェアに関する知識", "subcategory": "データベースの設計"}, {"term": "INSERT INTO 〜 VALUES 〜", "meaning": "表にレコードを追加するSQL文", "department": "ビジネス情報", "category": "データベースソフトウェアに関する知識", "subcategory": "SQL"}, {"term": "UPDATE 〜 SET 〜 WHERE 〜", "meaning": "条件に合うレコードの値を更新するSQL文", "department": "ビジネス情報", "category": "データベースソフトウェアに関する知識", "subcategory": "SQL"}, {"term": "DELETE FROM 〜 WHERE 〜", "meaning": "条件に合うレコードを削除するSQL文", "department": "ビジネス情報", "category": "データベースソフトウェアに関する知識", "subcategory": "SQL"}, {"term": "表名の別名指定", "meaning": "表に短い別名（AS）を付けて問合せを簡潔にする指定", "department": "ビジネス情報", "category": "データベースソフトウェアに関する知識", "subcategory": "SQL"}, {"term": "DISTINCT", "meaning": "重複行を除いて結果を取得するキーワード", "department": "ビジネス情報", "category": "データベースソフトウェアに関する知識", "subcategory": "SQL"}, {"term": "LIKE（ワイルドカード % _）", "meaning": "パターン一致で検索する演算子。%は任意の文字列、_は任意の1文字", "department": "ビジネス情報", "category": "データベースソフトウェアに関する知識", "subcategory": "SQL"}, {"term": "ORDER BY（ASC / DESC）", "meaning": "結果を昇順（ASC）・降順（DESC）に並べ替える句", "department": "ビジネス情報", "category": "データベースソフトウェアに関する知識", "subcategory": "SQL"}, {"term": "GROUP BY（HAVING）", "meaning": "行をグループ化して集計する句。HAVINGで集計後の条件を指定する", "department": "ビジネス情報", "category": "データベースソフトウェアに関する知識", "subcategory": "SQL"}, {"term": "BETWEEN", "meaning": "値が指定した範囲内にあるかを判定する演算子", "department": "ビジネス情報", "category": "データベースソフトウェアに関する知識", "subcategory": "SQL"}, {"term": "IN（NOT IN）", "meaning": "値がリストのいずれかに含まれるか（含まれないか）を判定する演算子", "department": "ビジネス情報", "category": "データベースソフトウェアに関する知識", "subcategory": "SQL"}, {"term": "副問合せ", "meaning": "SELECT文の中に別のSELECT文を入れ子にする問合せ", "department": "ビジネス情報", "category": "データベースソフトウェアに関する知識", "subcategory": "SQL"}, {"term": "EXISTS（NOT EXISTS）", "meaning": "副問合せの結果が存在するか（しないか）を判定する演算子", "department": "ビジネス情報", "category": "データベースソフトウェアに関する知識", "subcategory": "SQL"}];

const DEPTS = ["すべて", "共通", "ビジネス情報"];
const STORE_KEY = "zensho-info1-quiz-stats-v1";

let stats = loadStats();          // { term: { c: correct, w: wrong } }
let session = { total: 0, correct: 0, streak: 0 };
let current = null;
let answered = false;

const $ = (id) => document.getElementById(id);

function loadStats() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch { return {}; }
}
function saveStats() { localStorage.setItem(STORE_KEY, JSON.stringify(stats)); }

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function initScopeSelect() {
  const sel = $("scopeSel");
  const cats = [...new Set(TERMS.map(t => t.category))];
  sel.innerHTML = "";
  DEPTS.forEach(d => {
    const n = d === "すべて" ? TERMS.length : TERMS.filter(t => t.department === d).length;
    sel.add(new Option(`${d}（${n}語）`, d));
  });
  cats.forEach(c => {
    const n = TERMS.filter(t => t.category === c).length;
    sel.add(new Option(`${c}（${n}語）`, "cat:" + c));
  });
}

function pool() {
  const v = $("scopeSel").value;
  let p = v === "すべて" ? TERMS
        : v.startsWith("cat:") ? TERMS.filter(t => t.category === v.slice(4))
        : TERMS.filter(t => t.department === v);
  const mode = $("modeSel").value;
  if (mode === "wrongonly") p = p.filter(t => (stats[t.term]?.w || 0) > 0);
  return p;
}

function pickTerm(p) {
  if ($("modeSel").value !== "weak") {
    return p[Math.floor(Math.random() * p.length)];
  }
  // 苦手優先: 間違い回数に応じて重み付け（未出題も優先）
  const weights = p.map(t => {
    const s = stats[t.term] || { c: 0, w: 0 };
    return 1 + s.w * 3 + (s.c + s.w === 0 ? 1 : 0);
  });
  const sum = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * sum;
  for (let i = 0; i < p.length; i++) {
    r -= weights[i];
    if (r <= 0) return p[i];
  }
  return p[p.length - 1];
}

function buildChoices(term, direction, p) {
  const key = direction === "t2m" ? "meaning" : "term";
  // 同じ分野から優先して紛らわしい選択肢を作る
  const sameCat = p.filter(t => t.term !== term.term && t.category === term.category);
  const others = p.filter(t => t.term !== term.term && t.category !== term.category);
  const poolOf = shuffle(sameCat).concat(shuffle(others));
  const distractors = poolOf.slice(0, 3).map(t => t[key]);
  return shuffle([term[key], ...distractors]);
}

function nextQuestion() {
  const p = pool();
  if (p.length < 4) {
    $("qPrompt").textContent = "出題できる用語が4語未満です。範囲や出題方式を変えてください。";
    $("choices").innerHTML = "";
    $("qBadge").textContent = "";
    $("qMeta").textContent = "";
    $("nextRow").classList.remove("show");
    return;
  }
  answered = false;
  const term = pickTerm(p);
  const direction = Math.random() < 0.5 ? "t2m" : "m2t";
  const choices = buildChoices(term, direction, p);
  current = { term, direction, choices };

  $("qBadge").textContent = direction === "t2m" ? "この用語の意味は？" : "この意味の用語は？";
  $("qMeta").textContent = `${term.department} ／ ${term.category}`;
  const pr = $("qPrompt");
  pr.textContent = direction === "t2m" ? term.term : term.meaning;
  pr.className = "prompt" + (direction === "t2m" ? " term" : "");

  const box = $("choices");
  box.innerHTML = "";
  choices.forEach((c, i) => {
    const b = document.createElement("button");
    b.className = "choice";
    b.innerHTML = `<span class="num">${i + 1}</span><span></span>`;
    b.lastElementChild.textContent = c;
    b.addEventListener("click", () => answer(i));
    box.appendChild(b);
  });
  const fb = $("feedback");
  fb.className = "feedback";
  fb.textContent = "";
  $("nextRow").classList.remove("show");
}

function answer(i) {
  if (answered) return;
  answered = true;
  const { term, direction, choices } = current;
  const key = direction === "t2m" ? "meaning" : "term";
  const picked = choices[i];
  const correct = picked === term[key];

  const s = stats[term.term] || { c: 0, w: 0 };
  if (correct) { s.c++; session.correct++; session.streak++; }
  else { s.w++; session.streak = 0; }
  session.total++;
  stats[term.term] = s;
  saveStats();

  [...$("choices").children].forEach((b, j) => {
    b.disabled = true;
    if (choices[j] === term[key]) b.classList.add("correct");
    else if (j === i) b.classList.add("wrong");
  });

  const fb = $("feedback");
  fb.className = "feedback show " + (correct ? "ok" : "ng");
  fb.innerHTML = correct
    ? `<span class="label">正解！</span>`
    : `<span class="label">不正解…</span>正解は「${escapeHtml(direction === "t2m" ? term.meaning : term.term)}」`;
  $("nextRow").classList.add("show");
  updateStats();
  updateWeakList();
}

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function updateStats() {
  $("statTotal").textContent = session.total;
  $("statCorrect").textContent = session.correct;
  $("statRate").textContent = session.total ? Math.round(session.correct / session.total * 100) + "%" : "-";
  $("statStreak").textContent = session.streak;
}

function updateWeakList() {
  const weak = TERMS.filter(t => (stats[t.term]?.w || 0) > 0)
    .sort((a, b) => (stats[b.term].w - stats[b.term].c) - (stats[a.term].w - stats[a.term].c));
  $("weakBox").style.display = weak.length ? "block" : "none";
  $("weakCount").textContent = weak.length;
  $("weakList").innerHTML = weak.slice(0, 50)
    .map(t => `<li>${escapeHtml(t.term)}（×${stats[t.term].w}）</li>`).join("");
}

$("nextBtn").addEventListener("click", nextQuestion);
$("scopeSel").addEventListener("change", nextQuestion);
$("modeSel").addEventListener("change", nextQuestion);
$("resetStatsBtn").addEventListener("click", () => {
  if (confirm("これまでの学習記録（正解・間違い数）をすべて削除しますか？")) {
    stats = {};
    saveStats();
    session = { total: 0, correct: 0, streak: 0 };
    updateStats();
    updateWeakList();
    nextQuestion();
  }
});
document.addEventListener("keydown", (e) => {
  if (!answered && ["1", "2", "3", "4"].includes(e.key)) {
    const idx = Number(e.key) - 1;
    if ($("choices").children[idx]) answer(idx);
  } else if (answered && e.key === "Enter") {
    nextQuestion();
  }
});

$("totalTerms").textContent = TERMS.length;
initScopeSelect();
updateWeakList();
nextQuestion();
</script>
