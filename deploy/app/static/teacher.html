<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>先生用ダッシュボード — 情報処理1級クイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #d0bcff;
    --on-primary: #381e72;
    --primary-container: #4f378b;
    --on-primary-container: #eaddff;
    --secondary-container: #4a4458;
    --error: #f2b8b5;
    --good: #7ddc8e;
    --mid: #eec06c;
    --surface: #141218;
    --on-surface: #e6e0e9;
    --on-surface-var: #cac4d0;
    --surface-c-low: #1d1b20;
    --surface-c-high: #2b2930;
    --surface-c-highest: #36343b;
    --outline: #938f99;
    --outline-var: #49454f;
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --emph: cubic-bezier(0.05, 0.7, 0.1, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "M PLUS Rounded 1c", "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    background: var(--surface);
    color: var(--on-surface);
    padding: 16px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(16px) scale(0.98); } to { opacity: 1; transform: none; } }
  header { text-align: center; margin-bottom: 16px; }
  header h1 { font-size: 1.6rem; font-weight: 800; }
  .card {
    background: var(--surface-c-low);
    border: none;
    border-radius: 28px;
    padding: 24px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    animation: cardIn 0.45s var(--emph) backwards;
  }
  .sub { color: var(--on-surface-var); font-size: 0.85rem; }
  input[type=password] {
    width: 100%; max-width: 320px;
    padding: 12px 16px; font-size: 0.95rem;
    font-family: inherit;
    background: var(--surface-c-highest); color: var(--on-surface);
    border: 1px solid var(--outline-var); border-radius: 16px; margin-top: 14px;
  }
  input[type=password]:focus { outline: none; border-color: var(--primary); }
  .btn {
    background: var(--primary); color: var(--on-primary); border: none; border-radius: 999px;
    padding: 12px 26px; font-size: 0.95rem; font-weight: 800; cursor: pointer; margin-top: 14px;
    font-family: inherit; transition: transform 0.15s var(--spring), box-shadow 0.2s;
  }
  .btn:hover { box-shadow: 0 4px 14px rgba(208, 188, 255, 0.3); transform: translateY(-1px); }
  .btn:active { transform: scale(0.95); }
  .err { color: var(--error); font-size: 0.85rem; margin-top: 8px; display: none; }
  .okmsg { color: var(--good); font-size: 0.85rem; margin-top: 8px; display: none; }
  input[type=password].sm { margin-top: 4px; }
  h2 { font-size: 1.05rem; font-weight: 800; margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--outline-var); }
  th { color: var(--on-surface-var); font-size: 0.75rem; font-weight: 700; }
  tr:last-child td { border-bottom: none; }
  .rate { font-weight: 800; }
  .rate.good { color: var(--good); }
  .rate.mid { color: var(--mid); }
  .rate.bad { color: var(--error); }
  .bar-cell { min-width: 90px; }
  .mini { height: 8px; background: var(--surface-c-highest); border-radius: 999px; overflow: hidden; }
  .mini > div { height: 100%; background: var(--primary); border-radius: 999px; }
  .refreshed { font-size: 0.75rem; color: var(--on-surface-var); text-align: right; }
  .empty { color: var(--on-surface-var); font-size: 0.9rem; padding: 14px 0; }
  #dashArea { display: none; }

</style>
</head>
<body>
<div class="wrap">
  <header><h1>先生用ダッシュボード</h1></header>
  <div class="card" id="loginCard">
    <div class="sub">生徒の回答状況を確認できます。パスワードを入力してください。</div>
    <input type="password" id="pwInput" placeholder="パスワード">
    <div class="err" id="pwErr">パスワードが違います</div>
    <button class="btn" id="loginBtn">表示</button>
  </div>

  <div id="dashArea">
    <div class="card">
      <h2>生徒別 回答状況（<span id="studentCount">0</span>人）</h2>
      <table>
        <thead><tr><th>ID / 名前</th><th>回答数</th><th>正解数</th><th>正答率</th><th></th><th>pt</th><th>つよさ</th><th>最終回答</th></tr></thead>
        <tbody id="studentRows"></tbody>
      </table>
      <div class="empty" id="noStudents">まだ回答がありません</div>
    </div>

    <div class="card">
      <h2>用語別 正答率（間違えられやすい順）</h2>
      <table>
        <thead><tr><th>用語</th><th>出題数</th><th>正答率</th></tr></thead>
        <tbody id="termRows"></tbody>
      </table>
      <div class="empty" id="noTerms">まだ回答がありません</div>
    </div>
    <div class="card">
      <h2>パスワード変更</h2>
      <input type="password" class="sm" id="newPw" placeholder="新しいパスワード（4文字以上）">
      <div class="err" id="pwMsg"></div>
      <div class="okmsg" id="pwOk">変更しました</div>
      <button class="btn" id="pwBtn">変更</button>
    </div>
    <div class="refreshed">10秒ごとに自動更新 — 最終更新 <span id="ts">-</span></div>
  </div>
</div>

<script>
let pw = sessionStorage.getItem('teacher-pw') || '';
const $ = (id) => document.getElementById(id);

function rateClass(r) { return r >= 80 ? 'good' : r >= 50 ? 'mid' : 'bad'; }
function fmtTime(ts) {
  const d = new Date(ts * 1000);
  const p = (n) => String(n).padStart(2, '0');
  return `${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

async function load() {
  const res = await fetch('/api/stats?pw=' + encodeURIComponent(pw));
  if (res.status === 403) {
    if (pw) $('pwErr').style.display = 'block';
    $('loginCard').style.display = 'block';
    $('dashArea').style.display = 'none';
    return;
  }
  if (!res.ok) {
    $('pwErr').textContent = `取得に失敗しました（${res.status}）— D1データベースの作成・バインドを確認してください`;
    $('pwErr').style.display = 'block';
    $('loginCard').style.display = 'block';
    $('dashArea').style.display = 'none';
    return;
  }
  const d = await res.json();
  $('loginCard').style.display = 'none';
  $('dashArea').style.display = 'block';

  $('studentCount').textContent = d.students.length;
  $('noStudents').style.display = d.students.length ? 'none' : 'block';
  $('studentRows').innerHTML = d.students.map(s => `
    <tr>
      <td>${esc(s.student)}</td>
      <td>${s.answered}</td>
      <td>${s.correct}</td>
      <td class="rate ${rateClass(s.rate)}">${s.rate}%</td>
      <td class="bar-cell"><div class="mini"><div style="width:${s.rate}%"></div></div></td>
      <td>${s.points || 0}</td>
      <td>${s.power || 100}</td>
      <td>${fmtTime(s.last_ts)}</td>
    </tr>`).join('');

  $('noTerms').style.display = d.terms.length ? 'none' : 'block';
  $('termRows').innerHTML = d.terms.map(t => `
    <tr>
      <td>${esc(t.term)}</td>
      <td>${t.answered}</td>
      <td class="rate ${rateClass(t.rate)}">${t.rate}%</td>
    </tr>`).join('');
  $('ts').textContent = new Date().toLocaleTimeString('ja-JP');
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

$('loginBtn').onclick = () => {
  pw = $('pwInput').value;
  sessionStorage.setItem('teacher-pw', pw);
  $('pwErr').textContent = 'パスワードが違います';
  $('pwErr').style.display = 'none';
  load();
};
$('pwInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click(); });

$('pwBtn').onclick = async () => {
  const np = $('newPw').value.trim();
  $('pwMsg').style.display = 'none';
  $('pwOk').style.display = 'none';
  const res = await fetch('/api/password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pw, new_pw: np })
  });
  if (res.ok) {
    pw = np;
    sessionStorage.setItem('teacher-pw', pw);
    $('newPw').value = '';
    $('pwOk').style.display = 'block';
  } else {
    const d = await res.json().catch(() => ({}));
    $('pwMsg').textContent = d.error || `変更に失敗しました（${res.status}）`;
    $('pwMsg').style.display = 'block';
  }
};

if (pw) load();
setInterval(() => { if (pw) load(); }, 10000);
</script>
</body>
</html>
