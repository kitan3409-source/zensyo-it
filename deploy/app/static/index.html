<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>情報処理1級 4択クイズ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    background: #f0ebf8;
    color: #202124;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 16px;
  }
  .wrap { width: 100%; max-width: 680px; }
  .card {
    background: #fff;
    border-radius: 8px;
    border: 1px solid #dadce0;
    padding: 24px;
    margin-bottom: 14px;
  }
  .card.title-card { border-top: 8px solid #673ab7; }
  h1 { font-size: 1.5rem; margin-bottom: 6px; }
  .sub { color: #5f6368; font-size: 0.85rem; line-height: 1.6; }
  label { display: block; font-size: 0.85rem; color: #5f6368; margin: 14px 0 5px; }
  input[type=text], select {
    width: 100%;
    padding: 10px 12px;
    font-size: 0.95rem;
    border: 1px solid #dadce0;
    border-radius: 6px;
    background: #fff;
  }
  input[type=text]:focus, select:focus { outline: none; border-color: #673ab7; box-shadow: 0 0 0 2px #d2c6f0; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  .btn {
    background: #673ab7;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 11px 26px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 18px;
  }
  .btn:hover { background: #5e35b1; }
  .btn.secondary { background: #fff; color: #673ab7; border: 1px solid #dadce0; }
  .btn.secondary:hover { background: #f6f1fd; }
  .progress {
    height: 8px;
    background: #e2d9f3;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .progress > div { height: 100%; background: #673ab7; width: 0; transition: width .2s; }
  .qnum { font-size: 0.8rem; color: #5f6368; margin-bottom: 4px; }
  .qbadge {
    display: inline-block;
    font-size: 0.75rem;
    padding: 3px 10px;
    border-radius: 999px;
    background: #ede4fa;
    color: #673ab7;
    margin-bottom: 10px;
  }
  .prompt { font-size: 1.1rem; line-height: 1.7; margin-bottom: 18px; word-break: break-word; }
  .prompt.term { font-weight: 700; font-size: 1.3rem; color: #4527a0; }
  .choices { display: grid; gap: 8px; }
  .choice {
    text-align: left;
    background: #fff;
    border: 1px solid #dadce0;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 0.95rem;
    line-height: 1.5;
    cursor: pointer;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .choice:hover:not(:disabled) { border-color: #673ab7; background: #f6f1fd; }
  .choice .num {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid #80868b;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.72rem; font-weight: 700; color: #5f6368;
  }
  .choice:disabled { cursor: default; }
  .choice.correct { border-color: #188038; background: #e6f4ea; }
  .choice.correct .num { border-color: #188038; background: #188038; color: #fff; }
  .choice.wrong { border-color: #d93025; background: #fce8e6; }
  .choice.wrong .num { border-color: #d93025; background: #d93025; color: #fff; }
  .feedback { margin-top: 12px; font-size: 0.9rem; display: none; padding: 10px 12px; border-radius: 6px; }
  .feedback.show { display: block; }
  .feedback.ok { background: #e6f4ea; color: #137333; }
  .feedback.ng { background: #fce8e6; color: #c5221f; }
  .nav { display: flex; justify-content: flex-end; }
  .score { text-align: center; padding: 30px 0 10px; }
  .score .big { font-size: 3rem; font-weight: 700; color: #673ab7; }
  .err { color: #d93025; font-size: 0.85rem; margin-top: 8px; display: none; }
  .hint { text-align: center; color: #5f6368; font-size: 0.75rem; margin: 8px 0 20px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card title-card" id="startCard">
    <h1>情報処理1級 4択クイズ</h1>
    <div class="sub">全商 情報処理検定1級（共通＋ビジネス情報 全<span id="totalTerms">?</span>語）<br>名前を入力してスタート。回答は先生のダッシュボードに記録されます。</div>
    <label for="nameInput">名前</label>
    <input type="text" id="nameInput" placeholder="例：商業3年A組 田中" maxlength="50">
    <div class="row">
      <div>
        <label for="scopeSel">出題範囲</label>
        <select id="scopeSel"></select>
      </div>
      <div>
        <label for="countSel">問題数</label>
        <select id="countSel">
          <option value="10">10問</option>
          <option value="20" selected>20問</option>
          <option value="50">50問</option>
          <option value="all">全部</option>
        </select>
      </div>
    </div>
    <div class="err" id="nameErr">名前を入力してください</div>
    <button class="btn" id="startBtn">スタート</button>
  </div>

  <div id="quizArea" style="display:none">
    <div class="progress"><div id="bar"></div></div>
    <div class="card">
      <div class="qnum" id="qNum"></div>
      <span class="qbadge" id="qBadge"></span>
      <div class="prompt" id="qPrompt"></div>
      <div class="choices" id="choices"></div>
      <div class="feedback" id="feedback"></div>
      <div class="nav"><button class="btn" id="nextBtn" style="display:none">次へ</button></div>
    </div>
    <div class="hint">キーボード 1〜4 でも答えられます</div>
  </div>

  <div class="card" id="scoreCard" style="display:none">
    <div class="score">
      <div>お疲れさまでした！</div>
      <div class="big"><span id="scoreNum">0</span>点</div>
      <div class="sub" id="scoreDetail"></div>
      <button class="btn" id="againBtn">もう一度</button>
      <button class="btn secondary" id="backBtn">設定に戻る</button>
    </div>
  </div>
</div>

<script>
let TERMS = [];
let session = null;
let answered = false;
const $ = (id) => document.getElementById(id);

fetch('/terms').then(r => r.json()).then(d => {
  TERMS = d.terms;
  $('totalTerms').textContent = TERMS.length;
  const sel = $('scopeSel');
  const cats = [...new Set(TERMS.map(t => t.category))];
  sel.innerHTML = '';
  sel.add(new Option('すべて', 'すべて'));
  ['共通', 'ビジネス情報'].forEach(dep => sel.add(new Option(dep, dep)));
  cats.forEach(c => sel.add(new Option(c, 'cat:' + c)));
});

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pool() {
  const v = $('scopeSel').value;
  if (v === 'すべて') return TERMS;
  if (v.startsWith('cat:')) return TERMS.filter(t => t.category === v.slice(4));
  return TERMS.filter(t => t.department === v);
}

function startQuiz() {
  const name = $('nameInput').value.trim();
  if (!name) { $('nameErr').style.display = 'block'; return; }
  $('nameErr').style.display = 'none';
  localStorage.setItem('quiz-name', name);
  const p = shuffle(pool());
  const n = $('countSel').value === 'all' ? p.length : Math.min(parseInt($('countSel').value), p.length);
  session = { name, qs: p.slice(0, n), idx: 0, correct: 0 };
  $('startCard').style.display = 'none';
  $('scoreCard').style.display = 'none';
  $('quizArea').style.display = 'block';
  showQuestion();
}

function showQuestion() {
  answered = false;
  const t = session.qs[session.idx];
  const t2m = Math.random() < 0.5;
  const key = t2m ? 'meaning' : 'term';
  const same = shuffle(session.qs.filter(x => x.term !== t.term && x.category === t.category));
  const others = shuffle(TERMS.filter(x => x.term !== t.term && x.category !== t.category));
  const poolArr = same.concat(others).concat(shuffle(session.qs.filter(x => x.term !== t.term)));
  const distractors = [];
  for (const x of poolArr) {
    if (distractors.length >= 3) break;
    if (x[key] !== t[key] && !distractors.includes(x[key])) distractors.push(x[key]);
  }
  const choices = shuffle([t[key], ...distractors]);
  session.current = { t, t2m, key, choices };

  $('bar').style.width = (session.idx / session.qs.length * 100) + '%';
  $('qNum').textContent = `問題 ${session.idx + 1} / ${session.qs.length}`;
  $('qBadge').textContent = t2m ? 'この用語の意味は？' : 'この意味の用語は？';
  const pr = $('qPrompt');
  pr.textContent = t2m ? t.term : t.meaning;
  pr.className = 'prompt' + (t2m ? ' term' : '');
  const box = $('choices');
  box.innerHTML = '';
  choices.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = `<span class="num">${i + 1}</span><span></span>`;
    b.lastElementChild.textContent = c;
    b.onclick = () => answer(i);
    box.appendChild(b);
  });
  $('feedback').className = 'feedback';
  $('feedback').textContent = '';
  $('nextBtn').style.display = 'none';
}

async function answer(i) {
  if (answered) return;
  answered = true;
  const { t, t2m, key, choices } = session.current;
  const correct = choices[i] === t[key];
  if (correct) session.correct++;

  [...$('choices').children].forEach((b, j) => {
    b.disabled = true;
    if (choices[j] === t[key]) b.classList.add('correct');
    else if (j === i) b.classList.add('wrong');
  });
  const fb = $('feedback');
  fb.className = 'feedback show ' + (correct ? 'ok' : 'ng');
  fb.textContent = correct ? '正解！' : '不正解… 正解は「' + t[key] + '」';
  $('nextBtn').style.display = 'inline-block';
  $('nextBtn').textContent = session.idx + 1 >= session.qs.length ? '結果を見る' : '次へ';
  $('bar').style.width = ((session.idx + 1) / session.qs.length * 100) + '%';

  try {
    await fetch('/api/answer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        student: session.name,
        term: t.term,
        direction: t2m ? 't2m' : 'm2t',
        correct: correct
      })
    });
  } catch (e) { /* 記録失敗しても進める */ }
}

function next() {
  session.idx++;
  if (session.idx >= session.qs.length) {
    $('quizArea').style.display = 'none';
    $('scoreCard').style.display = 'block';
    const pct = Math.round(session.correct / session.qs.length * 100);
    $('scoreNum').textContent = pct;
    $('scoreDetail').textContent = `${session.qs.length}問中 ${session.correct}問正解 — ${session.name}`;
  } else {
    showQuestion();
  }
}

$('startBtn').onclick = startQuiz;
$('nextBtn').onclick = next;
$('againBtn').onclick = () => { session.qs = shuffle(pool()).slice(0, session.qs.length); session.idx = 0; session.correct = 0; $('scoreCard').style.display = 'none'; $('quizArea').style.display = 'block'; showQuestion(); };
$('backBtn').onclick = () => { $('scoreCard').style.display = 'none'; $('startCard').style.display = 'block'; };
document.addEventListener('keydown', (e) => {
  if ($('quizArea').style.display !== 'none' && !answered && ['1','2','3','4'].includes(e.key)) {
    const i = Number(e.key) - 1;
    if ($('choices').children[i]) answer(i);
  } else if (answered && e.key === 'Enter' && $('nextBtn').style.display !== 'none') {
    next();
  }
});

const saved = localStorage.getItem('quiz-name');
if (saved) $('nameInput').value = saved;
</script>
</body>
</html>
