<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>情報処理1級 4択クイズ</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card2: #273549;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --correct: #22c55e;
    --wrong: #ef4444;
    --border: #334155;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  .container { width: 100%; max-width: 720px; }
  header { text-align: center; margin-bottom: 14px; }
  header h1 { font-size: 1.35rem; margin-bottom: 4px; }
  header .sub { color: var(--muted); font-size: 0.8rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 14px;
  }
  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .controls input[type=text], .controls select {
    padding: 7px 10px;
    font-size: 0.85rem;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    min-width: 0;
  }
  .controls input[type=text] { flex: 1.2; }
  .controls select { flex: 1; }
  .controls input[type=text].need { border-color: var(--wrong); }
  #signedIn { font-size: 0.85rem; align-self: center; }
  #signedIn b { color: var(--accent); }
  #logoutLink { color: var(--muted); font-size: 0.75rem; margin-left: 8px; }
  #loginHint { color: var(--wrong); font-size: 0.8rem; display: none; margin-top: 4px; }
  input[type=text]:focus, select:focus { outline: none; border-color: var(--accent); }
  .btn {
    background: var(--accent);
    color: #082f49;
    border: none;
    border-radius: 8px;
    padding: 11px 24px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 16px;
  }
  .btn:hover { background: #7dd3fc; }
  .btn.ghost { background: var(--card2); color: var(--text); border: 1px solid var(--border); font-weight: 400; }
  .stats {
    display: flex;
    justify-content: center;
    gap: 18px;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .stats b { color: var(--text); }
  .progress { height: 6px; background: var(--card2); border-radius: 999px; overflow: hidden; margin-bottom: 14px; }
  .progress > div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
  .q-badge {
    display: inline-block;
    font-size: 0.75rem;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(56, 189, 248, 0.15);
    color: var(--accent);
    margin-bottom: 10px;
  }
  .q-meta { color: var(--muted); font-size: 0.75rem; margin-bottom: 10px; }
  .prompt { font-size: 1.15rem; line-height: 1.7; margin-bottom: 20px; word-break: break-word; }
  .prompt.term { font-weight: 700; font-size: 1.4rem; color: var(--accent); }
  .choices { display: grid; gap: 10px; }
  .choice {
    text-align: left;
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 14px;
    color: var(--text);
    font-size: 0.95rem;
    line-height: 1.5;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .choice .num {
    flex-shrink: 0;
    width: 22px; height: 22px;
    border-radius: 6px;
    background: var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem; font-weight: 700;
  }
  .choice:hover:not(:disabled) { border-color: var(--accent); }
  .choice:disabled { cursor: default; opacity: 0.85; }
  .choice.correct { border-color: var(--correct); background: rgba(34, 197, 94, 0.15); }
  .choice.correct .num { background: var(--correct); color: #052e16; }
  .choice.wrong { border-color: var(--wrong); background: rgba(239, 68, 68, 0.15); }
  .choice.wrong .num { background: var(--wrong); color: #450a0a; }
  .feedback {
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 0.9rem;
    line-height: 1.6;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.ok { background: rgba(34, 197, 94, 0.12); border: 1px solid var(--correct); }
  .feedback.ng { background: rgba(239, 68, 68, 0.12); border: 1px solid var(--wrong); }
  .feedback .label { font-weight: 700; margin-right: 8px; }
  .nav { margin-top: 14px; display: none; justify-content: flex-end; }
  .nav.show { display: flex; }
  .hint { text-align: center; color: var(--muted); font-size: 0.75rem; margin-top: 4px; }
  .score { text-align: center; padding: 24px 0 8px; }
  .score .big { font-size: 3rem; font-weight: 700; color: var(--accent); margin: 10px 0; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>情報処理1級 4択クイズ</h1>
    <div class="sub">全商 共通範囲＋ビジネス情報部門 全<span id="totalTerms">?</span>語</div>
  </header>

  <div class="controls">
    <div id="signinArea" style="flex:1">
      <div id="gbtn"></div>
      <div id="signedIn" style="display:none">ログイン中: <b id="who"></b><a href="#" id="logoutLink">切替</a></div>
      <div id="loginHint">← 学校のGoogleアカウントでログインしてね</div>
    </div>
  </div>
  <div class="controls">
    <select id="scopeSel" title="出題範囲"></select>
    <select id="countSel" title="問題数">
      <option value="10">10問</option>
      <option value="20" selected>20問</option>
      <option value="50">50問</option>
      <option value="all">全部</option>
    </select>
  </div>

  <div class="stats">
    <span>正解 <b id="statCorrect">0</b>/<b id="statTotal">0</b></span>
    <span>正答率 <b id="statRate">-</b></span>
    <span>連続正解 <b id="statStreak">0</b></span>
  </div>
  <div class="progress"><div id="bar"></div></div>

  <div class="card" id="quizCard">
    <div class="q-meta" id="qNum"></div>
    <span class="q-badge" id="qBadge"></span>
    <div class="prompt" id="qPrompt"></div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav" id="nextRow"><button class="btn" id="nextBtn">次の問題 →</button></div>
  </div>
  <div class="hint" id="hint">キーボード: 1〜4 で回答 / Enter で次へ</div>

  <div class="card" id="scoreCard" style="display:none">
    <div class="score">
      <div>お疲れさまでした！</div>
      <div class="big"><span id="scoreNum">0</span>点</div>
      <div class="sub" id="scoreDetail" style="color:var(--muted)"></div>
      <button class="btn" id="againBtn">もう一度</button>
    </div>
  </div>
</div>

<script>
let TERMS = [];
let session = null;
let answered = false;
const $ = (id) => document.getElementById(id);

let token = localStorage.getItem('quiz-token') || '';

fetch('/api/config').then(r => r.json()).then(c => {
  if (!c.client_id) { $('loginHint').textContent = 'ログイン未設定（client_idがありません）'; $('loginHint').style.display = 'block'; return; }
  const tryInit = (n) => {
    if (window.google && google.accounts && google.accounts.id) {
      google.accounts.id.initialize({ client_id: c.client_id, callback: onGoogle });
      google.accounts.id.renderButton($('gbtn'), { theme: 'filled_black', size: 'medium', text: 'signin_with', locale: 'ja' });
      showSignedIn();
    } else if (n < 100) {
      setTimeout(() => tryInit(n + 1), 100);
    } else {
      $('loginHint').textContent = 'Googleログインを読み込めません（再読み込みしてね）';
      $('loginHint').style.display = 'block';
    }
  };
  tryInit(0);
});

async function onGoogle(res) {
  const r = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ credential: res.credential })
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { $('loginHint').textContent = d.error || 'ログインに失敗しました'; $('loginHint').style.display = 'block'; return; }
  token = d.token;
  localStorage.setItem('quiz-token', token);
  localStorage.setItem('quiz-display', d.display);
  showSignedIn();
}

function showSignedIn() {
  const disp = localStorage.getItem('quiz-display') || '';
  if (token && disp) {
    $('who').textContent = disp;
    $('signedIn').style.display = 'block';
    $('gbtn').style.display = 'none';
    $('loginHint').style.display = 'none';
  }
}

$('logoutLink').onclick = (e) => {
  e.preventDefault();
  token = '';
  localStorage.removeItem('quiz-token');
  localStorage.removeItem('quiz-display');
  location.reload();
};

fetch('/terms.json').then(r => r.json()).then(d => {
  TERMS = d.terms;
  $('totalTerms').textContent = TERMS.length;
  const sel = $('scopeSel');
  const cats = [...new Set(TERMS.map(t => t.category))];
  sel.innerHTML = '';
  sel.add(new Option('すべて', 'すべて'));
  ['共通', 'ビジネス情報'].forEach(dep => sel.add(new Option(dep, dep)));
  cats.forEach(c => sel.add(new Option(c, 'cat:' + c)));
  startQuiz();
});

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pool() {
  const v = $('scopeSel').value;
  if (v === 'すべて') return TERMS;
  if (v.startsWith('cat:')) return TERMS.filter(t => t.category === v.slice(4));
  return TERMS.filter(t => t.department === v);
}

function startQuiz() {
  const p = shuffle(pool());
  const n = $('countSel').value === 'all' ? p.length : Math.min(parseInt($('countSel').value), p.length);
  session = { qs: p.slice(0, n), idx: 0, correct: 0, streak: 0 };
  $('scoreCard').style.display = 'none';
  $('quizCard').style.display = 'block';
  $('statTotal').textContent = session.qs.length;
  updateStats();
  showQuestion();
}

function showQuestion() {
  answered = false;
  const t = session.qs[session.idx];
  const t2m = Math.random() < 0.5;
  const key = t2m ? 'meaning' : 'term';
  const same = shuffle(TERMS.filter(x => x.term !== t.term && x.category === t.category));
  const others = shuffle(TERMS.filter(x => x.term !== t.term && x.category !== t.category));
  const poolArr = same.concat(others);
  const distractors = [];
  for (const x of poolArr) {
    if (distractors.length >= 3) break;
    if (x[key] !== t[key] && !distractors.includes(x[key])) distractors.push(x[key]);
  }
  const choices = shuffle([t[key], ...distractors]);
  session.current = { t, t2m, key, choices };

  $('bar').style.width = (session.idx / session.qs.length * 100) + '%';
  $('qNum').textContent = `問題 ${session.idx + 1} / ${session.qs.length} ｜ ${t.department} ／ ${t.category}`;
  $('qBadge').textContent = t2m ? 'この用語の意味は？' : 'この意味の用語は？';
  const pr = $('qPrompt');
  pr.textContent = t2m ? t.term : t.meaning;
  pr.className = 'prompt' + (t2m ? ' term' : '');
  const box = $('choices');
  box.innerHTML = '';
  choices.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = `<span class="num">${i + 1}</span><span></span>`;
    b.lastElementChild.textContent = c;
    b.onclick = () => answer(i);
    box.appendChild(b);
  });
  $('feedback').className = 'feedback';
  $('feedback').textContent = '';
  $('nextRow').classList.remove('show');
}

async function answer(i) {
  if (answered) return;
  if (!token) {
    $('loginHint').style.display = 'block';
    $('signinArea').scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  answered = true;
  const { t, t2m, key, choices } = session.current;
  const correct = choices[i] === t[key];
  if (correct) { session.correct++; session.streak++; } else { session.streak = 0; }

  [...$('choices').children].forEach((b, j) => {
    b.disabled = true;
    if (choices[j] === t[key]) b.classList.add('correct');
    else if (j === i) b.classList.add('wrong');
  });
  const fb = $('feedback');
  fb.className = 'feedback show ' + (correct ? 'ok' : 'ng');
  fb.innerHTML = correct
    ? '<span class="label">正解！</span>'
    : '<span class="label">不正解…</span>正解は「' + esc(t[key]) + '」';
  $('nextRow').classList.add('show');
  $('nextBtn').textContent = session.idx + 1 >= session.qs.length ? '結果を見る' : '次の問題 →';
  $('bar').style.width = ((session.idx + 1) / session.qs.length * 100) + '%';
  updateStats();

  try {
    await fetch('/api/answer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        token: token,
        term: t.term,
        direction: t2m ? 't2m' : 'm2t',
        correct: correct
      })
    });
  } catch (e) { /* 記録失敗しても進める */ }
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function updateStats() {
  $('statCorrect').textContent = session.correct;
  const done = session.idx + (answered ? 1 : 0);
  $('statRate').textContent = done ? Math.round(session.correct / done * 100) + '%' : '-';
  $('statStreak').textContent = session.streak;
}

function next() {
  session.idx++;
  if (session.idx >= session.qs.length) {
    $('quizCard').style.display = 'none';
    $('hint').style.display = 'none';
    $('scoreCard').style.display = 'block';
    const pct = Math.round(session.correct / session.qs.length * 100);
    $('scoreNum').textContent = pct;
    $('scoreDetail').textContent = `${session.qs.length}問中 ${session.correct}問正解`;
  } else {
    showQuestion();
  }
}

$('nextBtn').onclick = next;
$('againBtn').onclick = () => { $('hint').style.display = 'block'; startQuiz(); };
$('scopeSel').onchange = startQuiz;
$('countSel').onchange = startQuiz;
document.addEventListener('keydown', (e) => {
  if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
  if ($('quizCard').style.display !== 'none' && !answered && ['1','2','3','4'].includes(e.key)) {
    const i = Number(e.key) - 1;
    if ($('choices').children[i]) answer(i);
  } else if (answered && e.key === 'Enter' && $('nextRow').classList.contains('show')) {
    next();
  }
});


</script>
</body>
</html>
