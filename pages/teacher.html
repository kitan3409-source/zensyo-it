<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>先生用ダッシュボード — 情報処理1級クイズ</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card2: #273549;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --correct: #22c55e;
    --mid: #f59e0b;
    --wrong: #ef4444;
    --border: #334155;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 14px; }
  header h1 { font-size: 1.35rem; margin-bottom: 4px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 14px;
  }
  .sub { color: var(--muted); font-size: 0.85rem; }
  input[type=password] {
    width: 100%; max-width: 320px;
    padding: 10px 12px; font-size: 0.95rem;
    background: var(--card2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; margin-top: 14px;
  }
  input[type=password]:focus { outline: none; border-color: var(--accent); }
  .btn {
    background: var(--accent); color: #082f49; border: none; border-radius: 8px;
    padding: 11px 22px; font-size: 0.95rem; font-weight: 700; cursor: pointer; margin-top: 12px;
  }
  .btn:hover { background: #7dd3fc; }
  .err { color: var(--wrong); font-size: 0.85rem; margin-top: 8px; display: none; }
  .okmsg { color: var(--correct); font-size: 0.85rem; margin-top: 8px; display: none; }
  input[type=password].sm { margin-top: 4px; }
  h2 { font-size: 1.05rem; margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-size: 0.78rem; font-weight: 600; }
  .rate { font-weight: 700; }
  .rate.good { color: var(--correct); }
  .rate.mid { color: var(--mid); }
  .rate.bad { color: var(--wrong); }
  .bar-cell { min-width: 90px; }
  .mini { height: 8px; background: var(--card2); border-radius: 999px; overflow: hidden; }
  .mini > div { height: 100%; background: var(--accent); }
  .refreshed { font-size: 0.75rem; color: var(--muted); text-align: right; }
  .empty { color: var(--muted); font-size: 0.9rem; padding: 14px 0; }
  #dashArea { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>先生用ダッシュボード</h1></header>
  <div class="card" id="loginCard">
    <div class="sub">生徒の回答状況を確認できます。パスワードを入力してください。</div>
    <input type="password" id="pwInput" placeholder="パスワード">
    <div class="err" id="pwErr">パスワードが違います</div>
    <button class="btn" id="loginBtn">表示</button>
  </div>

  <div id="dashArea">
    <div class="card">
      <h2>生徒別 回答状況（<span id="studentCount">0</span>人）</h2>
      <table>
        <thead><tr><th>クラス 番号 名前</th><th>回答数</th><th>正解数</th><th>正答率</th><th></th><th>最終回答</th></tr></thead>
        <tbody id="studentRows"></tbody>
      </table>
      <div class="empty" id="noStudents">まだ回答がありません</div>
    </div>

    <div class="card">
      <h2>用語別 正答率（間違えられやすい順）</h2>
      <table>
        <thead><tr><th>用語</th><th>出題数</th><th>正答率</th></tr></thead>
        <tbody id="termRows"></tbody>
      </table>
      <div class="empty" id="noTerms">まだ回答がありません</div>
    </div>
    <div class="card">
      <h2>パスワード変更</h2>
      <input type="password" class="sm" id="newPw" placeholder="新しいパスワード（4文字以上）">
      <div class="err" id="pwMsg"></div>
      <div class="okmsg" id="pwOk">変更しました</div>
      <button class="btn" id="pwBtn">変更</button>
    </div>
    <div class="refreshed">10秒ごとに自動更新 — 最終更新 <span id="ts">-</span></div>
  </div>
</div>

<script>
let pw = sessionStorage.getItem('teacher-pw') || '';
const $ = (id) => document.getElementById(id);

function rateClass(r) { return r >= 80 ? 'good' : r >= 50 ? 'mid' : 'bad'; }
function fmtTime(ts) {
  const d = new Date(ts * 1000);
  const p = (n) => String(n).padStart(2, '0');
  return `${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

async function load() {
  const res = await fetch('/api/stats?pw=' + encodeURIComponent(pw));
  if (res.status === 403) {
    if (pw) $('pwErr').style.display = 'block';
    $('loginCard').style.display = 'block';
    $('dashArea').style.display = 'none';
    return;
  }
  if (!res.ok) {
    $('pwErr').textContent = `取得に失敗しました（${res.status}）— D1データベースの作成・バインドを確認してください`;
    $('pwErr').style.display = 'block';
    $('loginCard').style.display = 'block';
    $('dashArea').style.display = 'none';
    return;
  }
  const d = await res.json();
  $('loginCard').style.display = 'none';
  $('dashArea').style.display = 'block';

  $('studentCount').textContent = d.students.length;
  $('noStudents').style.display = d.students.length ? 'none' : 'block';
  $('studentRows').innerHTML = d.students.map(s => `
    <tr>
      <td>${esc(s.student)}</td>
      <td>${s.answered}</td>
      <td>${s.correct}</td>
      <td class="rate ${rateClass(s.rate)}">${s.rate}%</td>
      <td class="bar-cell"><div class="mini"><div style="width:${s.rate}%"></div></div></td>
      <td>${fmtTime(s.last_ts)}</td>
    </tr>`).join('');

  $('noTerms').style.display = d.terms.length ? 'none' : 'block';
  $('termRows').innerHTML = d.terms.map(t => `
    <tr>
      <td>${esc(t.term)}</td>
      <td>${t.answered}</td>
      <td class="rate ${rateClass(t.rate)}">${t.rate}%</td>
    </tr>`).join('');
  $('ts').textContent = new Date().toLocaleTimeString('ja-JP');
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

$('loginBtn').onclick = () => {
  pw = $('pwInput').value;
  sessionStorage.setItem('teacher-pw', pw);
  $('pwErr').textContent = 'パスワードが違います';
  $('pwErr').style.display = 'none';
  load();
};
$('pwInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click(); });

$('pwBtn').onclick = async () => {
  const np = $('newPw').value.trim();
  $('pwMsg').style.display = 'none';
  $('pwOk').style.display = 'none';
  const res = await fetch('/api/password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pw, new_pw: np })
  });
  if (res.ok) {
    pw = np;
    sessionStorage.setItem('teacher-pw', pw);
    $('newPw').value = '';
    $('pwOk').style.display = 'block';
  } else {
    const d = await res.json().catch(() => ({}));
    $('pwMsg').textContent = d.error || `変更に失敗しました（${res.status}）`;
    $('pwMsg').style.display = 'block';
  }
};

if (pw) load();
setInterval(() => { if (pw) load(); }, 10000);
</script>
</body>
</html>
