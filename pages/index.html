<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>情報処理1級 4択クイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #d0bcff;
    --on-primary: #381e72;
    --primary-container: #4f378b;
    --on-primary-container: #eaddff;
    --secondary-container: #4a4458;
    --tertiary: #efb8c8;
    --tertiary-container: #633b48;
    --error: #f2b8b5;
    --on-error-container: #f9dedc;
    --good: #7ddc8e;
    --on-good: #08391b;
    --surface: #141218;
    --on-surface: #e6e0e9;
    --on-surface-var: #cac4d0;
    --surface-c-low: #1d1b20;
    --surface-c: #211f26;
    --surface-c-high: #2b2930;
    --surface-c-highest: #36343b;
    --outline: #938f99;
    --outline-var: #49454f;
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --emph: cubic-bezier(0.05, 0.7, 0.1, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "M PLUS Rounded 1c", "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    background: var(--surface);
    color: var(--on-surface);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  .container { width: 100%; max-width: 720px; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(16px) scale(0.98); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { transform: scale(0.92); } to { transform: scale(1); } }
  header { text-align: center; margin-bottom: 16px; }
  header h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 4px; }
  header h1 .hl { color: var(--primary); }
  header .sub { color: var(--on-surface-var); font-size: 0.8rem; }
  .card {
    background: var(--surface-c-low);
    border: none;
    border-radius: 28px;
    padding: 24px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    animation: cardIn 0.45s var(--emph) backwards;
  }
  .card:nth-of-type(2) { animation-delay: 0.05s; }
  .card:nth-of-type(3) { animation-delay: 0.1s; }
  .card:nth-of-type(4) { animation-delay: 0.15s; }
  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .controls input[type=text], .controls input[type=password], .controls select {
    padding: 10px 14px;
    font-size: 0.85rem;
    font-family: inherit;
    background: var(--surface-c-highest);
    color: var(--on-surface);
    border: 1px solid var(--outline-var);
    border-radius: 16px;
    min-width: 0;
  }
  .controls input[type=text] { flex: 1.2; }
  .controls select { flex: 1; }
  .controls input[type=text].need, .controls input[type=password].need { border-color: var(--error); }
  #signedIn { font-size: 0.85rem; align-self: center; }
  #signedIn b { color: var(--primary); }
  #logoutLink { color: var(--outline); font-size: 0.75rem; margin-left: 8px; }
  #loginHint { color: var(--on-surface-var); font-size: 0.8rem; margin-top: 6px; }
  .gameArea { display: none; }
  .gameArea h2 { font-size: 1.05rem; font-weight: 800; margin-bottom: 12px; display: flex; gap: 14px; align-items: baseline; }
  .gameArea h2 .sub { font-size: 0.75rem; color: var(--on-surface-var); font-weight: 400; }
  .gameArea h2 .big { color: var(--primary); font-size: 1.25rem; }
  .eq { display: grid; gap: 4px; font-size: 0.85rem; color: var(--on-surface-var); }
  .eq b { color: var(--on-surface); }
  .mission { margin-bottom: 12px; font-size: 0.85rem; }
  .mission .mbar { height: 10px; background: var(--surface-c-highest); border-radius: 999px; overflow: hidden; margin-top: 6px; }
  .mission .mbar > div { height: 100%; background: var(--good); border-radius: 999px; transition: width 0.5s var(--spring); }
  .mission .mdone { color: var(--good); font-size: 0.75rem; font-weight: 700; }
  .shopItem { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--surface-c-high); border: none; border-radius: 16px; margin-bottom: 8px; font-size: 0.85rem; gap: 8px; }
  .shopItem .meta { flex: 1; min-width: 0; font-weight: 700; }
  .shopItem .meta small { color: var(--on-surface-var); display: block; font-weight: 400; }
  .shopItem .buy { background: var(--primary); color: var(--on-primary); border: none; border-radius: 999px; padding: 7px 16px; font-weight: 800; cursor: pointer; white-space: nowrap; font-family: inherit; transition: transform 0.15s var(--spring); }
  .shopItem .buy:active { transform: scale(0.92); }
  .shopItem .buy.owned { background: var(--secondary-container); color: var(--on-surface); }
  .shopItem .buy.equipped { background: var(--good); color: var(--on-good); }
  .rankRow { display: flex; justify-content: space-between; padding: 8px 10px; font-size: 0.85rem; border-radius: 12px; }
  .rankRow.me { background: var(--primary-container); }
  .rankRow.me .pw { color: var(--on-primary-container); }
  .rankRow .pw { color: var(--primary); font-weight: 800; }
  #gameNotice { color: var(--good); font-size: 0.85rem; font-weight: 700; margin-bottom: 8px; }
  .slotName { color: var(--on-surface-var); font-size: 0.75rem; font-weight: 700; margin: 12px 0 6px; }
  .rankBadge { display: inline-flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .rankBadge .letter { font-size: 2.4rem; font-weight: 800; color: var(--primary); line-height: 1; }
  .rankBadge .title { color: var(--on-surface-var); font-size: 0.85rem; font-weight: 700; }
  .rankNext { font-size: 0.8rem; color: var(--on-surface-var); margin-top: 8px; }
  .bossHp { height: 16px; background: var(--surface-c-highest); border-radius: 999px; overflow: hidden; margin: 8px 0; }
  .bossHp > div { height: 100%; background: linear-gradient(90deg, #ef4444, #f97316); border-radius: 999px; transition: width 0.5s var(--spring); }
  .bossInfo { font-size: 0.8rem; color: var(--on-surface-var); display: flex; justify-content: space-between; }
  .gachaBtn { width: 100%; padding: 14px; font-size: 1rem; }
  #gachaResult { margin-top: 10px; font-size: 0.9rem; min-height: 1.2em; }
  #gachaResult .rar { font-weight: 800; }
  .rar-SSR { color: #ffd54a; } .rar-SR { color: var(--primary); } .rar-R { color: #7dd8f0; } .rar-N { color: var(--on-surface-var); }
  .achGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ach { padding: 8px 12px; border-radius: 14px; background: var(--surface-c-high); font-size: 0.78rem; opacity: 0.45; }
  .ach.on { opacity: 1; background: var(--primary-container); }
  .ach .an { font-weight: 800; }
  .ach .ad { color: var(--on-surface-var); font-size: 0.7rem; }
  .ach.on .ad { color: var(--on-primary-container); }
  .regionRow { display: flex; justify-content: space-between; align-items: center; padding: 7px 4px; font-size: 0.82rem; border-bottom: 1px solid var(--outline-var); }
  .regionRow:last-child { border-bottom: none; }
  .regionRow .st { font-size: 0.75rem; color: var(--on-surface-var); }
  .regionRow .st.clr { color: var(--good); font-weight: 800; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .tabs button { background: var(--surface-c-high); color: var(--on-surface-var); border: none; border-radius: 999px; padding: 6px 14px; font-size: 0.78rem; font-weight: 700; font-family: inherit; cursor: pointer; }
  .tabs button.on { background: var(--primary); color: var(--on-primary); }
  input[type=text]:focus, select:focus { outline: none; border-color: var(--primary); }
  .btn {
    background: var(--primary);
    color: var(--on-primary);
    border: none;
    border-radius: 999px;
    padding: 12px 28px;
    font-size: 0.95rem;
    font-family: inherit;
    font-weight: 800;
    cursor: pointer;
    margin-top: 16px;
    transition: transform 0.15s var(--spring), box-shadow 0.2s;
  }
  .btn:hover { box-shadow: 0 4px 14px rgba(208, 188, 255, 0.3); transform: translateY(-1px); }
  .btn:active { transform: scale(0.95); }
  .btn.ghost { background: var(--secondary-container); color: var(--on-surface); font-weight: 700; }
  .stats {
    display: flex;
    justify-content: center;
    gap: 18px;
    font-size: 0.85rem;
    color: var(--on-surface-var);
    margin-bottom: 12px;
  }
  .stats b { color: var(--on-surface); }
  .progress { height: 10px; background: var(--surface-c-highest); border-radius: 999px; overflow: hidden; margin-bottom: 14px; }
  .progress > div {
    height: 100%;
    width: 0;
    border-radius: 999px;
    background: repeating-linear-gradient(-45deg, var(--primary) 0 10px, #b79df6 10px 20px);
    background-size: 28px 100%;
    animation: waveMove 1.2s linear infinite;
    transition: width 0.5s var(--spring);
  }
  @keyframes waveMove { to { background-position: 28px 0; } }
  .q-badge {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 700;
    padding: 5px 14px;
    border-radius: 999px;
    background: var(--primary-container);
    color: var(--on-primary-container);
    margin-bottom: 10px;
  }
  .q-meta { color: var(--on-surface-var); font-size: 0.75rem; margin-bottom: 10px; }
  .prompt { font-size: 1.15rem; line-height: 1.7; margin-bottom: 20px; word-break: break-word; }
  .prompt.term { font-weight: 800; font-size: 1.5rem; color: var(--primary); }
  .choices { display: grid; gap: 10px; }
  .choice {
    text-align: left;
    background: var(--surface-c-high);
    border: 2px solid transparent;
    border-radius: 20px;
    padding: 14px 16px;
    color: var(--on-surface);
    font-size: 0.95rem;
    font-family: inherit;
    line-height: 1.5;
    cursor: pointer;
    transition: transform 0.15s var(--spring), border-color 0.15s, background 0.15s;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    animation: pop 0.3s var(--spring);
  }
  .choice .num {
    flex-shrink: 0;
    width: 26px; height: 26px;
    border-radius: 999px;
    background: var(--surface-c-highest);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem; font-weight: 800;
  }
  .choice:hover:not(:disabled) { background: color-mix(in srgb, var(--primary) 10%, var(--surface-c-high)); transform: scale(1.01); }
  .choice:active:not(:disabled) { transform: scale(0.98); }
  .choice:disabled { cursor: default; opacity: 0.9; }
  .choice.correct { border-color: var(--good); background: color-mix(in srgb, var(--good) 15%, var(--surface-c-high)); }
  .choice.correct .num { background: var(--good); color: var(--on-good); }
  .choice.wrong { border-color: var(--error); background: color-mix(in srgb, var(--error) 14%, var(--surface-c-high)); }
  .choice.wrong .num { background: var(--error); color: #601410; }
  .feedback {
    margin-top: 14px;
    padding: 14px 16px;
    border-radius: 20px;
    font-size: 0.9rem;
    line-height: 1.6;
    display: none;
  }
  .feedback.show { display: block; animation: pop 0.35s var(--spring); }
  .feedback.ok { background: color-mix(in srgb, var(--good) 14%, var(--surface-c-low)); border: 2px solid var(--good); }
  .feedback.ng { background: color-mix(in srgb, var(--error) 12%, var(--surface-c-low)); border: 2px solid var(--error); }
  .feedback .label { font-weight: 800; margin-right: 8px; }
  .nav { margin-top: 14px; display: none; justify-content: flex-end; }
  .nav.show { display: flex; }
  .hint { text-align: center; color: var(--on-surface-var); font-size: 0.75rem; margin-top: 4px; }
  .score { text-align: center; padding: 24px 0 8px; }
  .score .big { font-size: 3.5rem; font-weight: 800; color: var(--primary); margin: 10px 0; animation: pop 0.5s var(--spring); }
  .score .msg { color: var(--on-surface-var); margin-bottom: 6px; }

</style>
</head>
<body>
<div class="container">
  <header>
    <h1>情報処理<span class="hl">1級</span> 4択クイズ</h1>
    <div class="sub">全商 共通範囲＋ビジネス情報部門 全<span id="totalTerms">?</span>語</div>
  </header>

  <div class="controls">
    <div id="signinArea" style="flex:1">
      <div id="manualLogin" style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        <input type="text" id="inCls" placeholder="クラス(例:2-5)" style="width:6.5em">
        <input type="text" id="inNum" placeholder="番号" style="width:4em">
        <input type="text" id="inName" placeholder="名前" style="width:9em">
        <input type="password" id="inPin" placeholder="PIN(4文字以上)" style="width:9em">
        <button class="btn" id="loginBtn" style="margin-top:0;padding:10px 18px">ログイン</button>
      </div>
      <div id="signedIn" style="display:none">ログイン中: <b id="who"></b><a href="#" id="logoutLink">切替</a></div>
      <div id="loginHint">← 初回はPINを決めて登録、2回目以降はそのPINでログイン</div>
    </div>
  </div>
  <div class="controls">
    <select id="scopeSel" title="出題範囲"></select>
    <select id="countSel" title="問題数">
      <option value="10">10問</option>
      <option value="20" selected>20問</option>
      <option value="50">50問</option>
      <option value="all">全部</option>
    </select>
  </div>

  <div class="stats">
    <span>正解 <b id="statCorrect">0</b>/<b id="statTotal">0</b></span>
    <span>正答率 <b id="statRate">-</b></span>
    <span>連続正解 <b id="statStreak" style="color:var(--good)">0</b></span>
  </div>
  <div class="progress"><div id="bar"></div></div>

  <div class="card" id="quizCard">
    <div class="q-meta" id="qNum"></div>
    <span class="q-badge" id="qBadge"></span>
    <div class="prompt" id="qPrompt"></div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav" id="nextRow"><button class="btn" id="nextBtn">次の問題 →</button></div>
  </div>
  <div class="hint" id="hint">キーボード: 1〜4 で回答 / Enter で次へ</div>

  <div class="card gameArea" id="charCard">
    <h2>キャラ <span class="sub">つよさ <b class="big" id="powerVal">100</b></span> <span class="sub">ポイント <b class="big" id="pointVal">0</b>pt</span> <span class="sub">連続ログイン <b id="streakVal">0</b>日</span></h2>
    <div class="rankBadge"><span class="letter" id="rankVal">E</span><span class="title" id="rankTitle">ただの生徒</span></div>
    <div class="mission"><div class="mbar"><div id="rankBar"></div></div><div class="rankNext" id="rankNext"></div></div>
    <div id="gameNotice"></div>
    <div class="eq" id="equipList"></div>
  </div>

  <div class="card gameArea" id="bossCard">
    <h2>週間ボス <span class="sub" id="bossSub"></span></h2>
    <div style="font-weight:800" id="bossName"></div>
    <div class="bossHp"><div id="bossBar"></div></div>
    <div class="bossInfo"><span id="bossMy"></span><span id="bossAtk"></span></div>
  </div>

  <div class="card gameArea" id="gachaCard">
    <h2>ガチャ <span class="sub">1回 100pt — N60% R30% SR9% SSR1%</span></h2>
    <button class="btn gachaBtn" id="gachaBtn">ガチャをまわす</button>
    <div id="gachaResult"></div>
  </div>

  <div class="card gameArea" id="missionCard">
    <h2>今日のミッション</h2>
    <div id="missionList"></div>
  </div>

  <div class="card gameArea" id="regionCard">
    <h2>分野制覇 <span class="sub">8問以上かつ正答率60%で制覇 +100pt</span></h2>
    <div id="regionList"></div>
  </div>

  <div class="card gameArea" id="achCard">
    <h2>実績 <span class="sub" id="achCount"></span></h2>
    <div class="achGrid" id="achList"></div>
  </div>

  <div class="card gameArea" id="shopCard">
    <h2>ショップ</h2>
    <div id="shopList"></div>
  </div>

  <div class="card gameArea" id="rankCard">
    <h2>ランキング</h2>
    <div class="tabs" id="rankTabs">
      <button data-t="power" class="on">つよさ</button>
      <button data-t="rank">ランク</button>
      <button data-t="weekly">今週のpt</button>
      <button data-t="streak">連続ログイン</button>
    </div>
    <div id="rankList"></div>
  </div>

  <div class="card" id="scoreCard" style="display:none">
    <div class="score">
      <div>お疲れさまでした！</div>
      <div class="big"><span id="scoreNum">0</span>点</div>
      <div class="sub" id="scoreDetail" style="color:var(--muted)"></div>
      <button class="btn" id="againBtn">もう一度</button>
    </div>
  </div>
</div>

<script>
let TERMS = [];
let session = null;
let answered = false;
const $ = (id) => document.getElementById(id);

let token = localStorage.getItem('quiz-token') || '';

$('loginBtn').onclick = doLogin;
$('inPin').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
$('inName').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  const body = {
    cls: $('inCls').value.trim(), num: $('inNum').value.trim(),
    name: $('inName').value.trim(), pin: $('inPin').value
  };
  const r = await fetch('/api/student_login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { $('loginHint').textContent = d.error || 'ログインに失敗しました'; $('loginHint').style.color = 'var(--bad)'; return; }
  token = d.token;
  localStorage.setItem('quiz-token', token);
  localStorage.setItem('quiz-display', d.display);
  showSignedIn();
}

function showSignedIn() {
  const disp = localStorage.getItem('quiz-display') || '';
  if (token && disp) {
    $('who').textContent = disp;
    $('signedIn').style.display = 'block';
    $('manualLogin').style.display = 'none';
    $('loginHint').style.display = 'none';
    for (const el of document.querySelectorAll('.gameArea')) el.style.display = 'block';
    loadGame();
  }
}

const SLOT_LABEL = { weapon: '武器', armor: '服', acc: 'アクセサリ' };
const RANK_TITLE = { SS: '情報の神', S: '電脳賢者', A: '検定の覇者', B: '用語マスター', C: '問題ハンター', D: '勉強家見習い', E: 'ただの生徒' };
let me = null;
let rankData = null;
let rankTab = 'power';

function allItems() {
  const m = { ...(me ? me.items : {}) };
  for (const i of (me ? me.gacha : [])) m[i.id] = i;
  return m;
}

async function loadGame() {
  const r = await fetch('/api/me?token=' + encodeURIComponent(token));
  if (!r.ok) return;
  me = await r.json();
  const items = allItems();
  $('powerVal').textContent = me.power;
  $('pointVal').textContent = me.points;
  $('streakVal').textContent = me.streak;
  $('rankVal').textContent = me.rank;
  $('rankTitle').textContent = RANK_TITLE[me.rank] || '';
  $('rankNext').textContent = me.next_at
    ? `累計${me.total}問 — 次のランクまであと ${me.next_at - me.total} 問`
    : `累計${me.total}問 — 最高ランク到達`;
  const prev = me.next_at ? ({ 20: 0, 50: 20, 100: 50, 200: 100, 400: 200, 800: 400 }[me.next_at] || 0) : 800;
  $('rankBar').style.width = me.next_at ? Math.min(100, (me.total - prev) / (me.next_at - prev) * 100) + '%' : '100%';
  $('gameNotice').textContent = me.login_bonus ? `ログインボーナス +${me.login_bonus}pt!` : '';
  $('equipList').innerHTML = ['weapon', 'armor', 'acc'].map(s => {
    const id = me.equipped[s];
    const it = id ? items[id] : null;
    return `<div>${SLOT_LABEL[s]}: <b>${it ? it.name + ' +' + it.power : 'なし'}</b></div>`;
  }).join('');

  const bs = me.boss;
  $('bossName').textContent = bs.defeated ? `${bs.name} — 討伐済み` : bs.name;
  $('bossSub').textContent = bs.defeated ? '貢献者全員に+200pt配布済み' : '正解でダメージ（つよさが高いほど大ダメージ）';
  $('bossBar').style.width = Math.round(bs.hp / bs.max_hp * 100) + '%';
  $('bossMy').textContent = `あなたのダメージ: ${bs.my_dmg}`;
  $('bossAtk').textContent = `参加者 ${bs.attackers}人 / 残りHP ${bs.hp}`;

  $('missionList').innerHTML = me.missions.map(m => `
    <div class="mission">
      <div>${m.desc}（${m.progress}/${m.goal}） <span class="sub">+${m.bonus}pt</span> ${m.claimed ? '<span class="mdone">達成済み</span>' : ''}</div>
      <div class="mbar"><div style="width:${Math.min(100, m.progress / m.goal * 100)}%"></div></div>
    </div>`).join('');

  $('regionList').innerHTML = me.regions.length
    ? me.regions.map(r => `<div class="regionRow"><span>${r.cat}</span><span class="st${r.cleared ? ' clr' : ''}">${r.cleared ? '制覇' : `${r.answered}問 ${r.rate}%`}</span></div>`).join('')
    : '<div class="regionRow"><span class="st">まだ回答がありません</span></div>';

  const unl = new Set(me.unlocked);
  $('achCount').textContent = `${unl.size}/${Object.keys(me.achievements).length}`;
  $('achList').innerHTML = Object.entries(me.achievements).map(([k, a]) =>
    `<div class="ach${unl.has(k) ? ' on' : ''}"><div class="an">${unl.has(k) ? a.name : '？？？'}</div><div class="ad">${a.desc} +${a.bonus}pt</div></div>`).join('');

  const groups = [['weapon', '武器'], ['armor', '服'], ['acc', 'アクセサリ']];
  $('shopList').innerHTML = groups.map(([slot, label]) =>
    `<div class="slotName">${label}</div>` +
    Object.entries(me.items).filter(([, it]) => it.slot === slot).map(([id, it]) => {
      const owned = me.inventory.includes(id);
      const equipped = me.equipped[slot] === id;
      const label2 = equipped ? '装備中（外す）' : owned ? '装備する' : `${it.price}pt`;
      const cls = equipped ? 'buy equipped' : owned ? 'buy owned' : 'buy';
      return `<div class="shopItem"><div class="meta">${it.name}<small>つよさ+${it.power}</small></div>
        <button class="${cls}" onclick="shop('${id}')">${label2}</button></div>`;
    }).join('')
  ).join('');

  const gachaOwned = me.gacha.filter(i => me.inventory.includes(i.id));
  if (gachaOwned.length) {
    $('shopList').innerHTML += '<div class="slotName">ガチャ産アイテム（装備）</div>' +
      gachaOwned.map(i => {
        const equipped = me.equipped[i.slot] === i.id;
        return `<div class="shopItem"><div class="meta">${i.name} <span class="rar rar-${i.rarity}">${i.rarity}</span><small>${SLOT_LABEL[i.slot]} つよさ+${i.power}</small></div>
          <button class="buy ${equipped ? 'equipped' : 'owned'}" onclick="equipIt('${i.id}')">${equipped ? '装備中（外す）' : '装備する'}</button></div>`;
      }).join('');
  }

  const rr = await fetch('/api/ranking?token=' + encodeURIComponent(token));
  if (rr.ok) { rankData = await rr.json(); renderRank(); }
}

const RANK_FMT = {
  power: (r) => `つよさ ${r.power}`,
  rank: (r) => `ランク${r.rank}（${r.total}問）`,
  weekly: (r) => `今週 +${r.weekly}pt`,
  streak: (r) => `${r.streak}日連続`,
};

function renderRank() {
  if (!rankData) return;
  const list = rankData[rankTab] || [];
  $('rankList').innerHTML = list.length
    ? list.map((r, i) => `<div class="rankRow${r.id === rankData.me ? ' me' : ''}"><span>${i + 1}位 ${r.name}（${r.id}）</span><span class="pw">${RANK_FMT[rankTab](r)}</span></div>`).join('')
    : '<div class="rankRow">まだ誰もいません</div>';
}

for (const b of document.querySelectorAll('#rankTabs button')) {
  b.onclick = () => {
    rankTab = b.dataset.t;
    document.querySelectorAll('#rankTabs button').forEach(x => x.classList.toggle('on', x === b));
    renderRank();
  };
}

async function equipIt(id) {
  const it = allItems()[id];
  const equipped = me.equipped[it.slot] === id;
  const r = await fetch('/api/equip', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token, slot: it.slot, item: equipped ? '' : id })
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { $('gameNotice').textContent = d.error || 'エラー'; return; }
  loadGame();
}

async function shop(id) {
  const it = me.items[id];
  const owned = me.inventory.includes(id);
  const equipped = me.equipped[it.slot] === id;
  const url = owned ? '/api/equip' : '/api/buy';
  const body = owned
    ? { token, slot: it.slot, item: equipped ? '' : id }
    : { token, item: id };
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { $('gameNotice').textContent = d.error || 'エラー'; return; }
  loadGame();
}

$('gachaBtn').onclick = async () => {
  $('gachaResult').innerHTML = 'まわしています…';
  const r = await fetch('/api/gacha', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token })
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { $('gachaResult').textContent = d.error || 'エラー'; return; }
  const it = d.item;
  $('gachaResult').innerHTML =
    `<span class="rar rar-${it.rarity}">[${it.rarity}]</span> <b>${it.name}</b>（${SLOT_LABEL[it.slot]} つよさ+${it.power}）` +
    (d.dup ? ' — ダブり！50pt返還' : '');
  if (me) { me.points = d.points; $('pointVal').textContent = d.points; }
  loadGame();
};

$('logoutLink').onclick = (e) => {
  e.preventDefault();
  token = '';
  localStorage.removeItem('quiz-token');
  localStorage.removeItem('quiz-display');
  location.reload();
};

fetch('/terms').then(r => r.json()).then(d => {
  TERMS = d.terms;
  $('totalTerms').textContent = TERMS.length;
  const sel = $('scopeSel');
  const cats = [...new Set(TERMS.map(t => t.category))];
  sel.innerHTML = '';
  sel.add(new Option('すべて', 'すべて'));
  ['共通', 'ビジネス情報'].forEach(dep => sel.add(new Option(dep, dep)));
  cats.forEach(c => sel.add(new Option(c, 'cat:' + c)));
  startQuiz();
});

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pool() {
  const v = $('scopeSel').value;
  if (v === 'すべて') return TERMS;
  if (v.startsWith('cat:')) return TERMS.filter(t => t.category === v.slice(4));
  return TERMS.filter(t => t.department === v);
}

function startQuiz() {
  const p = shuffle(pool());
  const n = $('countSel').value === 'all' ? p.length : Math.min(parseInt($('countSel').value), p.length);
  session = { qs: p.slice(0, n), idx: 0, correct: 0, streak: 0 };
  $('scoreCard').style.display = 'none';
  $('quizCard').style.display = 'block';
  $('statTotal').textContent = session.qs.length;
  updateStats();
  showQuestion();
}

function showQuestion() {
  answered = false;
  const t = session.qs[session.idx];
  const t2m = Math.random() < 0.5;
  const key = t2m ? 'meaning' : 'term';
  const same = shuffle(TERMS.filter(x => x.term !== t.term && x.category === t.category));
  const others = shuffle(TERMS.filter(x => x.term !== t.term && x.category !== t.category));
  const poolArr = same.concat(others);
  const distractors = [];
  for (const x of poolArr) {
    if (distractors.length >= 3) break;
    if (x[key] !== t[key] && !distractors.includes(x[key])) distractors.push(x[key]);
  }
  const choices = shuffle([t[key], ...distractors]);
  session.current = { t, t2m, key, choices };

  $('bar').style.width = (session.idx / session.qs.length * 100) + '%';
  $('qNum').textContent = `問題 ${session.idx + 1} / ${session.qs.length} ｜ ${t.department} ／ ${t.category}`;
  $('qBadge').textContent = t2m ? 'この用語の意味は？' : 'この意味の用語は？';
  const pr = $('qPrompt');
  pr.textContent = t2m ? t.term : t.meaning;
  pr.className = 'prompt' + (t2m ? ' term' : '');
  const box = $('choices');
  box.innerHTML = '';
  choices.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = `<span class="num">${i + 1}</span><span></span>`;
    b.lastElementChild.textContent = c;
    b.onclick = () => answer(i);
    box.appendChild(b);
  });
  $('feedback').className = 'feedback';
  $('feedback').textContent = '';
  $('nextRow').classList.remove('show');
}

async function answer(i) {
  if (answered) return;
  if (!token) {
    $('loginHint').style.display = 'block';
    $('signinArea').scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  answered = true;
  const { t, t2m, key, choices } = session.current;
  const correct = choices[i] === t[key];
  if (correct) { session.correct++; session.streak++; } else { session.streak = 0; }

  [...$('choices').children].forEach((b, j) => {
    b.disabled = true;
    if (choices[j] === t[key]) b.classList.add('correct');
    else if (j === i) b.classList.add('wrong');
  });
  const fb = $('feedback');
  fb.className = 'feedback show ' + (correct ? 'ok' : 'ng');
  fb.innerHTML = correct
    ? '<span class="label">正解！</span>'
    : '<span class="label">不正解…</span>正解は「' + esc(t[key]) + '」';
  $('nextRow').classList.add('show');
  $('nextBtn').textContent = session.idx + 1 >= session.qs.length ? '結果を見る' : '次の問題 →';
  $('bar').style.width = ((session.idx + 1) / session.qs.length * 100) + '%';
  updateStats();

  try {
    const ar = await fetch('/api/answer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        token: token,
        term: t.term,
        direction: t2m ? 't2m' : 'm2t',
        correct: correct
      })
    });
    const ad = ar.ok ? await ar.json() : null;
    if (ad) {
      if (me) { me.points = ad.points; $('pointVal').textContent = ad.points; }
      const notes = [];
      if (ad.combo) notes.push(`連撃ボーナス +${ad.combo}pt`);
      if (ad.missions_done && ad.missions_done.length) notes.push('ミッション達成: ' + ad.missions_done.map(m => m.desc + ` +${m.bonus}pt`).join('、'));
      if (ad.ach_new && ad.ach_new.length) notes.push('実績解除: ' + ad.ach_new.map(a => a.name + ` +${a.bonus}pt`).join('、'));
      if (ad.rank_up) notes.push(`ランクアップ！ ${ad.rank_up}（${RANK_TITLE[ad.rank_up] || ''}）`);
      if (ad.boss) notes.push(ad.boss.killed ? `ボス「${ad.boss.name}」討伐！ +200pt` : `ボスに${ad.boss.dmg}ダメージ`);
      if (notes.length) fb.innerHTML += ' <b>' + notes.map(esc).join(' / ') + '</b>';
      loadGame();
    }
  } catch (e) { /* 記録失敗しても進める */ }
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function updateStats() {
  $('statCorrect').textContent = session.correct;
  const done = session.idx + (answered ? 1 : 0);
  $('statRate').textContent = done ? Math.round(session.correct / done * 100) + '%' : '-';
  $('statStreak').textContent = session.streak;
}

function next() {
  session.idx++;
  if (session.idx >= session.qs.length) {
    $('quizCard').style.display = 'none';
    $('hint').style.display = 'none';
    $('scoreCard').style.display = 'block';
    const pct = Math.round(session.correct / session.qs.length * 100);
    $('scoreNum').textContent = pct;
    $('scoreDetail').textContent = `${session.qs.length}問中 ${session.correct}問正解`;
  } else {
    showQuestion();
  }
}

$('nextBtn').onclick = next;
$('againBtn').onclick = () => { $('hint').style.display = 'block'; startQuiz(); };
$('scopeSel').onchange = startQuiz;
$('countSel').onchange = startQuiz;
document.addEventListener('keydown', (e) => {
  if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
  if ($('quizCard').style.display !== 'none' && !answered && ['1','2','3','4'].includes(e.key)) {
    const i = Number(e.key) - 1;
    if ($('choices').children[i]) answer(i);
  } else if (answered && e.key === 'Enter' && $('nextRow').classList.contains('show')) {
    next();
  }
});


</script>
</body>
</html>
